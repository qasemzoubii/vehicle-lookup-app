version: '3.8'

services:
  backend:
    build:
      context: ./VehicleLookup
      dockerfile: Dockerfile
    container_name: vehicle-backend
    ports:
      - "5215:5215"
    networks:
      - vehicle-network

  frontend:
    build:
      context: ./vehicle-lookup-frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://13.51.237.47:5215/api/vehicle
    container_name: vehicle-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - vehicle-network

networks:
  vehicle-network:
    driver: bridge